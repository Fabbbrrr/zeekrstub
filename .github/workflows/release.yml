name: release

# Tag pushes and main build and verify only. Publishing a GitHub release is a
# deliberate act: it overwrites the one artifact the car depends on, so it never
# happens by accident, and it never replaces an existing release asset.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode (must be higher than the installed one)'
        required: false
      version_name:
        description: 'versionName, also the release name'
        required: false
      branch:
        description: 'branch to build from'
        required: false
        default: main
      publish:
        description: 'Publish a release for this tag if none exists yet'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # setup-android's default package list still asks for "tools", which the
      # SDK repository no longer publishes; name only what this build needs.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: SDK platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Unit tests
        run: |
          chmod +x gradlew   # a Windows checkout loses the exec bit
          ./gradlew :app:testDebugUnitTest --console=plain

      - name: Signed release APK
        run: |
          ARGS=""
          if [ -n "${{ inputs.version_code }}" ]; then ARGS="$ARGS -Pstub.versionCode=${{ inputs.version_code }}"; fi
          if [ -n "${{ inputs.version_name }}" ]; then ARGS="$ARGS -Pstub.versionName=${{ inputs.version_name }}"; fi
          ./gradlew :app:distRelease :app:distSpare --console=plain $ARGS

      - name: Prove the signature and the version of both identities
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for APK in dist/*.apk; do
            echo "== $APK"
            "$BT/aapt2" dump badging "$APK" | head -2
            "$BT/apksigner" verify --print-certs "$APK"
            sha256sum "$APK"
            ls -l "$APK"
          done

      - name: Publish release
        if: inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! echo "$TAG" | grep -q '^v'; then
            echo "not a tag ref ($TAG); nothing to publish"
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; leaving its asset untouched"
            exit 0
          fi
          gh release create "$TAG" dist/*.apk --generate-notes --title "${TAG#v}"
