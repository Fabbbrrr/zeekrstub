# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# Build knobs. Every value here is configurable; the APK carries the defaults
# below into BuildConfig so a fresh install starts with them.
#
# RELEASE RULE: bump stub.versionCode on EVERY release. Same applicationId, same
# key, higher versionCode. Equal versionCode = Android refuses the update.
# Current number is recorded in RELEASES.md.
# ---------------------------------------------------------------------------
stub.versionCode=1
stub.versionName=1.0.0

# Default self-update source baked into the app (Settings can change it).
stub.owner=Fabbbrrr
stub.repo=zeekrstub

# Which release tags the app accepts by default. Comma separated, * wildcard,
# empty = every non-draft release. "v*" matches v1.0.0 but not 1.0.0.
stub.tagFilter=v*

# GitHub API host. Override for GitHub Enterprise or a mirror.
stub.apiHost=api.github.com

# Release branch this build came from (shown on About, and used by CI to pick
# the ref). Purely informational at runtime.
stub.branch=main
